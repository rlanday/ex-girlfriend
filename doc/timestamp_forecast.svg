<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="t d">
<title id="t">Timestamp forecast in part B of the metadata block</title>
<desc id="d">Three records of part B with the forecast that is fed in front of them and the bytes that repeat it, a count of how close the forecast is, and the rule that computes it.</desc>
<rect x="0.5" y="0.5" width="959" height="789" rx="6" fill="#fcfcfb" stroke="#d9d8d1"/>
<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#0b0b0b" font-weight="600">Timestamp forecast in part B of the metadata block</text>
<text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">In front of a record the models are fed a forecast of its timestamp as known bytes. The forecast is not coded; the record behind it is.</text>
<text x="24" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">It is the last thing the models see before the record. A right forecast is repeated byte for byte; in B2 a wrong one is mostly close.</text>
<line x1="713.5" y1="99" x2="713.5" y2="111" stroke="#52514e" stroke-width="1.3"/>
<line x1="718.5" y1="99" x2="718.5" y2="111" stroke="#52514e" stroke-width="1.3"/>
<text x="728" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">the record repeats the byte above</text>
<rect x="24" y="99" width="4" height="13" fill="#5598e7"/>
<text x="36" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Part B2, record 87,863</tspan><tspan fill="#52514e" dx="8">the forecast is exact</tspan></text>
