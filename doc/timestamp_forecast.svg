<text x="24" y="579" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">How close the forecast is</tspan><tspan fill="#52514e" dx="8">counted on the stream</tspan></text>
<text x="24" y="601" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Part B2, 155,612 records</text>
<text x="102" y="622" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">exact</text>
<rect x="110" y="612" width="30.45" height="12" fill="#5598e7" rx="2"/>
<text x="146.45" y="622" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">13 %</text>
<text x="102" y="641" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">within 1 s</text>
<rect x="110" y="631" width="77.44" height="12" fill="#5598e7" rx="2"/>
<text x="193.44" y="641" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">34 %</text>
<text x="102" y="660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">within 3 s</text>
<rect x="110" y="650" width="128.88" height="12" fill="#5598e7" rx="2"/>
<text x="244.88" y="660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">56 %</text>
<text x="102" y="679" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">within 10 s</text>
<rect x="110" y="669" width="181.95" height="12" fill="#5598e7" rx="2"/>
<text x="297.95" y="679" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">79 %</text>
<text x="102" y="698" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">within 30 s</text>
<rect x="110" y="688" width="207.5" height="12" fill="#5598e7" rx="2"/>
<text x="323.5" y="698" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">90 %</text>
<line x1="110" y1="609" x2="110" y2="703" stroke="#b5b4aa" stroke-width="1"/>
<text x="24" y="722" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">same number of digits as the true difference: 93 %</text>
<text x="24" y="739" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Part B1, 87,812 forecasts (record 0 has none):</text>
<text x="24" y="756" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">exact 2 %, within 30 s 12 %, median error 50 days;</text>
<text x="24" y="773" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">four or more leading bytes equal 33 %, none 42 %</text>
<text x="452" y="601" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">How it is computed.</tspan><tspan fill="#52514e" dx="6">From the revision ids, which part A carries, and the</tspan></text>
<text x="452" y="618" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">timestamps of the records before, in integer arithmetic:</text>
<text x="464" y="635" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" dx="0">slope = seconds per revision id between two neighbouring records</text>
<text x="464" y="652" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" dx="0">forecast = previous timestamp + step of the revision id</text>
<text x="464" y="669" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" dx="60">x median of the last 32 slopes</text>
<text x="452" y="686" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Form.</tspan><tspan fill="#52514e" dx="6">B1: the forecast timestamp in six bytes. B2: the forecast of the</tspan></text>
<text x="452" y="703" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">difference as a decimal number. A tab follows in both.</text>
<text x="452" y="720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Decompressor.</tspan><tspan fill="#52514e" dx="6">It computes the same bytes from what it has decoded and</tspan></text>
<text x="452" y="737" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">feeds them at the same place.</text>
</svg>
