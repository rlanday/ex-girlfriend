<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="t d">
<title id="t">Rows fed to the transformer in front of a title</title>
<desc id="d">Two pages of the coder stream, one of the redirect block and one article, each with the rows that are fed to the transformer in front of the title and with the title that is then predicted and coded.</desc>
