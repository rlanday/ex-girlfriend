<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#0b0b0b" font-weight="600">Rows fed to the transformer in front of a title</text>
<text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Two pages of the coder stream. The rows give the transformer the page before it has to predict the first byte of the title.</text>
<rect x="24" y="81" width="12" height="12" fill="#eb6834"/>
<text x="43" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Page 6,818 of the stream, in the redirect block</text>
<text x="24" y="111" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">a run of redirect pages is one document: the context continues</text>
