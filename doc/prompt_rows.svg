<rect x="24" y="398" width="5" height="18" fill="#eb6834"/>
<text x="38" y="411" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">redirect row: the page is one of the first 71,148 pages, the redirect block</text>
<rect x="24.5" y="417.5" width="4" height="17" fill="#fcfcfb" stroke="#6f6e69" stroke-width="1"/>
<text x="38" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">page number: a count of the pages, kept by compressor and decompressor</text>
<rect x="24" y="435" width="24.9" height="18" fill="#fcfcfb" rx="9" stroke="#c3c2b7" stroke-width="1"/>
<text x="36.45" y="448.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle">4</text>
<text x="58.9" y="449" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">one extra token after each run of digits: the class of its length, here 4 digits. Every row ends with a line feed.</text>
<text x="24" y="472" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">The output of the last fed row is the prediction for the first byte of the title. The transformer was trained on this stream with the same rows.</text>
<text x="24" y="489" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">It sees the bytes of the preprocessed stream (dictionary codes, marks for capital letters); they are shown here as text.</text>
