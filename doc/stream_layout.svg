<text x="496.87" y="433" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">alias rows at the page they point to (transformer input)</text>
<line x1="64.6" y1="379" x2="64.6" y2="388" stroke="#52514e" stroke-width="1.2"/>
<text x="71" y="392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">stream header, 39 B</text>
<path d="M278.44 378 V452 H881.47 V387" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M881.47 379 l-4.5 9 h9 z" fill="#2a78d6"/>
<text x="64" y="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">page id, contributor and date of every page return in front of its title as page rows (transformer input);</text>
<text x="64" y="485" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">the contributor is fed to all models again in front of the comment line of the page</text>
