<text x="357.57" y="366.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">part B</text>
<text x="64" y="274" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">metadata block</tspan><tspan fill="#52514e" dx="8">5.16 MB (0.93 %)</tspan></text>
<text x="64" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">two records for each of the 243,425 pages</text>
<text x="64" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">transformer and BITLSTM off, PPMd at order 14</text>
<text x="496.87" y="274" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">redirect block</tspan><tspan fill="#52514e" dx="8">71,148 pages, 3.64 MB (0.66 %)</tspan></text>
<text x="496.87" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">at its start the transformer and BITLSTM switch on,</text>
<text x="496.87" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">the PPMd model restarts empty and the learning-rate</text>
<text x="496.87" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">schedule of the mixers starts again</text>
<text x="799.47" y="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">articles</text>
<line x1="491.87" y1="339" x2="491.87" y2="382" stroke="#0b0b0b" stroke-width="1.2"/>
