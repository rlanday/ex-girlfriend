<text x="936" y="601" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">7,925 pages, 4.41 MB</text>
<text x="936" y="616" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">the last 477 are geographic names and personal names</text>
