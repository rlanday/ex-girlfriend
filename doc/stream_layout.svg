<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" height="642" role="img" aria-labelledby="t d">
<title id="t">Layout of the coder stream</title>
<desc id="d">The coder stream to scale: stream header, metadata block, redirect block, articles with the calendar block, census pages, image pages, Wikipedia: pages and disambiguation pages, with enlarged views of the first 1.9 % and the last 3.0 %, and arrows for the fields that return later as model input.</desc>
