<rect x="490" y="668" width="12" height="12" fill="#c9c7bd"/>
<text x="509" y="678" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">an article</text>
<text x="24" y="701" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Only pages in front of page 88,249 in the stream can be sources. The decompressor has decoded them and builds the same rows.</text>
<text x="24" y="719" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Synonyms stand in stream order. Aliases: redirect titles not yet fed as synonyms, then the link texts, the most frequent first.</text>
<text x="24" y="737" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Link context: a link counts if it begins with the title as the page spells it; a link written [alkane], in lower case, does not.</text>
<text x="24" y="755" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Of these links the latest that fit are taken, at most 8, oldest first; each piece is cut in its paragraph to 64 tokens.</text>
<text x="24" y="773" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Titles and link texts are kept in a table in memory. The link context is read back from a temporary copy of the stream coded so far.</text>
<text x="24" y="791" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">These rows go to the transformer only. It sees the bytes of the preprocessed stream; they are shown here as text, long rows shortened (...).</text>
</svg>
