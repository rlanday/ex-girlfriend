<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 816" width="960" height="816" role="img" aria-labelledby="t d">
<title id="t">Rows fed to the transformer behind a title</title>
<desc id="d">Page 88,249 of the coder stream, Alkane. Behind its title the transformer is fed three kinds of rows, each taken from an earlier page of the stream: the titles of three redirect pages as synonyms, the text around six earlier links to the page as link context, and the texts of four earlier links as aliases.</desc>
